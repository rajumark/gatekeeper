<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatekeeper Web</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Gatekeeper</h1>
    <p id="platform" class="muted"></p>
    <input id="text" placeholder="Message or comment" autocomplete="off">
    <div id="sens" class="segs"></div>
    <section class="card">
        <div id="verdict" class="verdict"></div>
        <div id="score"></div>
        <div class="label">Categories (hints)</div>
        <div id="cats"></div>
        <p id="timing" class="muted small"></p>
    </section>
    <h2>Try</h2>
    <div id="examples" class="row"></div>
    <p class="muted small">Runs on this device. No network, no permission.</p>
    <p id="load" class="muted small"></p>
</main>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
